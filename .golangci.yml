version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    # Complexity
    - gocyclo
    - gocognit
    - funlen
    - nestif

    # Bug detection
    - govet
    - staticcheck
    - errcheck
    - gosec
    - nilnil
    - nilerr
    - ineffassign

    # Style
    - misspell
    - whitespace
    - unconvert
    - unparam

    # Naming
    - revive

    # Performance
    - prealloc

    # Code practices
    - goconst
    - gocritic
    - goprintffuncname
    - nolintlint
    - nakedret

    # Duplication
    - dupl
    - durationcheck

  settings:
    govet:
      enable:
        - copylocks
      disable:
        - fieldalignment

    gocyclo:
      min-complexity: 20

    funlen:
      lines: 120
      statements: 60

    gocognit:
      min-complexity: 35

    misspell:
      locale: US

    nestif:
      min-complexity: 6

    revive:
      rules:
        - name: var-naming
        - name: error-return
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id

    gocritic:
      enabled-tags:
        - diagnostic
        - performance

      disabled-checks:
        - commentFormatting
        - commentedOutCode
        - ifElseChain

      settings:
        hugeParam:
          sizeThreshold: 256

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - funlen
          - errcheck
          - gosec
          - goconst
          - dupl
          - gocognit

      # Exported v2 API (MIME_JSON, ...): renaming would break importers
      - path: reader\.go
        linters:
          - revive
        text: "var-naming: don't use ALL_CAPS"

      # The route tree's lookup is the router's hot path, written as one function with named
      # results on purpose; splitting it is a performance change with its own benchmarks.
      - path: store\.go
        linters:
          - gocyclo
          - gocognit
          - nestif
          - nakedret

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
